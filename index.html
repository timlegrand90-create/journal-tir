<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal de tir</title>
<meta name="theme-color" content="#14181F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE everyday tool, used on a phone at the range
   IDEA a shooter's range book: one page per rifle, each string logged and checked
   PICTURE the live record itself: big numbers, colored alerts, the dope readout
   COLOUR night slate ground, amber for input, cyan for measured, green for the result
   TYPE Barlow Condensed figures + Inter text
   LAYOUT single column phone app with bottom tabs; centered 560px column on laptop */
:root{color-scheme:dark;--bg:#1C2129;--card:#252B36;--line:#323A48;--deep:#14181F;--ink:#E6EAF0;--mut:#9AA5B5;--amb:#FFB826;--cy:#4CC0F2;--gr:#40E08C;--red:#F25959}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px 110px}
h1,h2,.num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;margin:0;line-height:1.05}
h1{font-size:34px}
h2{font-size:22px;font-weight:600}
.top{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.top .sub{color:var(--mut);font-size:14px}
.back{width:44px;height:44px;border-radius:12px;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.arme{display:block;width:100%;text-align:left;cursor:pointer}
.arme:hover{border-color:var(--amb)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border-radius:14px;padding:12px}
.kpi .num{font-size:32px}
.lab{font-size:13px;color:var(--mut)}
.amb{color:var(--amb)}.cy{color:var(--cy)}.gr{color:var(--gr)}.red{color:var(--red)}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-gr{background:#163A2A;color:var(--gr)}.p-red{background:#4A1A1A;color:#FFC9C9}.p-mut{background:var(--deep);color:var(--mut)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.btn{min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:600;cursor:pointer}
.b-amb{background:var(--amb);color:#1C2129}.b-out{background:transparent;border:2px solid var(--line)}.b-red{background:transparent;border:2px solid var(--red);color:var(--red)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:92px;box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:999px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.chip.on{border-color:var(--amb);background:#2E2715}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;min-height:48px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:72px}
.sec{font-size:13px;font-weight:600;color:var(--amb);margin:18px 0 8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step button{width:48px;height:48px;border-radius:12px;border:0;background:var(--line);font-size:22px;cursor:pointer}
.step .num{font-size:36px}
.drop{border:2px dashed var(--cy);background:#16242E;color:var(--cy);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.drop input{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;height:76px;background:var(--deep);border-top:1px solid #2A313D;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);text-decoration:none;font-size:12px}
.tabs a.on{color:var(--amb);font-weight:600}
.big{background:#13261C;border:2px solid var(--gr);border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.big>div{display:flex;flex-direction:column;align-items:center}
.big .num{font-size:clamp(56px,16vw,76px);color:#5CFF9D}
.big span{font-size:13px;color:#9EE8C0}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--amb)}
input[type=checkbox]{width:24px;min-height:24px;height:24px;accent-color:var(--gr)}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;color:var(--ink)}
.bar{height:10px;background:var(--deep);border-radius:5px;overflow:hidden}.bar i{display:block;height:10px;border-radius:5px}
.fig{position:relative;height:180px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:13px}
.note{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--gr);color:#0D2418;font-weight:600;padding:10px 16px;border-radius:12px}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:0 16px 40px}
.modal .in{max-width:560px;margin:0 auto}
.close{width:44px;height:44px;border-radius:12px;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer;font-size:22px;color:var(--ink);flex:none}
.verdict{border-radius:14px;padding:12px;margin-top:10px;font-weight:600}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script id="data" type="application/json">/*DATA*/{"armes":[]}/*END*/</script>

  const f = st.form && (st.form.armeId === a.id || st.form.id) ? st.form : (st.form = Object.assign(blank(a), { armeId: a.id }));
  const sv = f.shots.length ? `Fichier importé : ${f.shots.length} vitesses · moy ${fr(mean(f.shots))} · SD ${fr(sdev(f.shots))} · ES ${fr(Math.max(...f.shots) - Math.min(...f.shots))}` : '';
  app.innerHTML = head(a, f.id ? 'Modifier la série' : 'Nouvelle série') + `<form id="fs">
  <div class="sec">Charge</div><div class="chips">${a.charges.map(c => `<button type="button" class="chip ${f.charge === c.id ? 'on' : ''}" data-c="${c.id}"><div style="font-weight:600">${esc(c.nom)}</div><div class="lab">${esc(c.poudre)}${c.oal ? ' · OAL ' + esc(c.oal) : ''}</div></button>`).join('')}<button type="button" class="chip" id="nc">+ Charge</button></div>
  ${st.addCharge ? chargeForm() : ''}
  <div class="grid g2" style="margin-top:14px"><div><label for="fd">Date</label><input id="fd" type="date" value="${esc(f.date)}"></div><div><label for="fl">Lieu</label><input id="fl" value="${esc(f.lieu)}"></div></div>
  <div class="grid g2" style="margin-top:10px"><div class="kpi"><div class="lab">Coups</div><div class="step"><button type="button" id="cm" aria-label="Un coup de moins">−</button><span class="num amb">${esc(f.coups)}</span><button type="button" id="cpl" aria-label="Un coup de plus">+</button></div></div>
    <div class="grid"><div><label for="fdi">Distance de ces ${esc(f.coups)} coups (m)</label><input id="fdi" inputmode="numeric" value="${esc(f.dist)}"></div><div><label for="ft">Température (°C)</label><input id="ft" inputmode="decimal" value="${esc(f.temp)}"></div></div></div>
  <div class="sec">Vitesses</div>
  <label class="drop" for="csv">${ICON.u}<span><b>Importer le fichier du chrono</b><br><span class="lab">Garmin Xero, LabRadar… (.csv)</span></span><input id="csv" type="file" accept=".csv,.txt,text/csv"></label>
  ${sv ? `<p class="note gr">${sv}</p>` : `<div class="grid g3" style="margin-top:10px"><div><label for="fv">V moy</label><input id="fv" inputmode="decimal" value="${esc(f.v)}"></div><div><label for="fsd">SD</label><input id="fsd" inputmode="decimal" value="${esc(f.sd)}"></div><div><label for="fes">ES</label><input id="fes" inputmode="decimal" value="${esc(f.es)}"></div></div>`}
  <div class="sec">Résultat</div>
  <div class="grid g3"><div><label for="fg">Groupe (mm)</label><input id="fg" inputmode="decimal" value="${esc(f.groupe)}"></div><div><label for="fh">Hausse (clics)</label><input id="fh" inputmode="numeric" value="${esc(f.hausse)}"></div><div><label for="fde">Dérive (clics)</label><input id="fde" inputmode="numeric" value="${esc(f.derive)}"></div></div>
  <div style="margin-top:10px"><label for="fn">Notes</label><textarea id="fn">${esc(f.notes)}</textarea></div>
  <label class="check"><input type="checkbox" id="fc" ${f.nettoye ? 'checked' : ''}>Canon nettoyé après cette série</label>
  <button class="btn b-amb" style="width:100%;margin-top:8px">Enregistrer la série</button></form>`;
  const keep = () => { const g = id => { const e = $('#' + id); return e ? e.value : undefined; }; Object.assign(f, { date: g('fd'), lieu: g('fl'), dist: g('fdi'), temp: g('ft'), groupe: g('fg'), hausse: g('fh'), derive: g('fde'), notes: g('fn'), nettoye: $('#fc').checked }); if ($('#fv')) Object.assign(f, { v: g('fv'), sd: g('fsd'), es: g('fes') }); };
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { keep(); f.charge = b.dataset.c; serie(a); });
  $('#nc').onclick = () => { keep(); st.addCharge = !st.addCharge; serie(a); };
  const cok = $('#cok'); if (cok) cok.onclick = () => { keep(); const id = readCharge(a); if (!id) return; f.charge = id; st.addCharge = false; save('Charge ajoutée'); serie(a); };
  $('#cm').onclick = () => { keep(); f.coups = Math.max(1, f.coups - 1); serie(a); };
  $('#cpl').onclick = () => { keep(); f.coups++; serie(a); };
  $('#csv').onchange = e => { const file = e.target.files[0]; if (!file) return; file.text().then(t => { keep(); const shots = []; for (const line of t.split(/\r?\n/)) { const m = line.match(/^\s*\d+\s*[,;]\s*"?(\d{3,4}(?:[.,]\d+)?)"?/); if (m) shots.push(parseFloat(m[1].replace(',', '.'))); } if (!shots.length) { toast('Aucune vitesse trouvée'); return; } f.shots = shots; f.coups = shots.length; f.v = fr(mean(shots)); f.sd = +sdev(shots).toFixed(1); f.es = +(Math.max(...shots) - Math.min(...shots)).toFixed(1); serie(a); }); };
  $('#fs').onsubmit = e => { e.preventDefault(); keep(); if (!f.charge) { toast('Ajoute une charge'); return; } const s = { id: f.id || uid(), date: f.date, heure: f.heure, lieu: f.lieu, charge: f.charge, coups: f.coups, dist: num(f.dist), temp: num(f.temp), v: f.shots.length ? '' : num(f.v), sd: num(f.sd), es: num(f.es), groupe: num(f.groupe), hausse: num(f.hausse), derive: num(f.derive), nettoye: f.nettoye, notes: f.notes, shots: f.shots };
    const i = a.series.findIndex(x => x.id === s.id); if (i >= 0) a.series[i] = s; else a.series.push(s); st.form = null; save('Série enregistrée'); location.hash = 'a-' + a.id + '-c-' + s.charge; };
}

function calcul(a, c) {
  if (!modalEl) return;
  const C = st.calc;
  a.verifs = a.verifs || [];
  const K = know(a, c);
  const top = `<div class="top"><button class="close" id="xc" aria-label="Fermer le calcul">✕</button><div><h1>Calcul de tir</h1><div class="sub">${esc(c.nom)}</div></div></div>`;
  if (!K.vref) { modalEl.innerHTML = `<div class="in">${top}<div class="card"><h2>Pas encore de vitesse mesurée</h2><p class="lab">Enregistre une série avec ton chrono pour activer le calcul.</p></div></div>`; $('#xc').onclick = () => closeModal(); return; }
  const TR = trueUp(a, c, K);
  const done = a.verifs.filter(v => v.charge === c.id && v.result).slice(-8).reverse();
  const Q = st.chk && st.chk.charge === c.id ? st.chk : null;
  modalEl.innerHTML = `<div class="in">${top}
  <div class="card" style="margin-bottom:12px"><div class="grid g3">
    <div><div class="num cy" style="font-size:24px" id="kv"></div><div class="lab">V0 du jour</div></div>
    <div><div class="num ${K.sd <= 4 ? 'gr' : K.sd <= 7 ? 'amb' : 'red'}" style="font-size:24px">${K.sd ? fr(K.sd) : '—'}</div><div class="lab">SD chrono (${K.shots || K.n} coups)</div></div>
    <div><div class="num ${TR.n ? 'gr' : ''}" style="font-size:24px">${TR.n ? (TR.dv > 0 ? '+' : '') + TR.dv + ' m/s' : '—'}</div><div class="lab">${TR.n ? 'recalage sur ' + TR.n + ' vérif.' : 'pas encore recalé'}</div></div></div>
    <p class="note" style="margin:8px 0 0">Vref ${fr(K.vref)} m/s à ${fr(K.tref, 0)} °C${K.sens ? ' · ' + (K.sens > 0 ? '+' : '') + fr(K.sens, 2) + ' m/s par °C (mesuré)' : ' · sensibilité T° pas encore mesurable'}${TR.n && TR.bm !== 1 ? ' · BC ×' + fr(TR.bm, 3) + ' (tirs ≥ 600 m)' : ''}${TR.n && TR.dm !== 1 ? ' · dérive ×' + fr(TR.dm, 2) : ''}</p>${Math.abs(TR.dv) > 25 ? '<p class="note amb" style="margin:6px 0 0">⚠ Gros recalage (' + (TR.dv > 0 ? '+' : '') + TR.dv + ' m/s) : vérifie aussi ton zéro et la valeur réelle d\'un clic de ta lunette.</p>' : ''}</div>
  <div class="grid g4"><div><label for="rt">T° (°C)</label><input id="rt" inputmode="decimal" value="${C.T}"></div><div><label for="rp">hPa</label><input id="rp" inputmode="numeric" value="${C.P}"></div><div><label for="ru">Humidité %</label><input id="ru" inputmode="numeric" value="${C.hum}"></div><div><label for="ra">Angle (°)</label><input id="ra" inputmode="decimal" value="${C.ang}"></div></div>
  <div class="grid g4" style="margin-top:8px"><div><label for="rw">Vent m/s</label><input id="rw" inputmode="decimal" value="${C.W}"></div><div><label for="rh">Vient de (h)</label><input id="rh" inputmode="decimal" value="${fr(C.H, C.H % 1 ? 1 : 0)}"></div><div><label for="rz">Direction (°)</label><input id="rz" inputmode="numeric" value="${C.az ?? ''}" placeholder="facult."></div><div><label for="rl">Latitude</label><input id="rl" inputmode="decimal" value="${C.lat}"></div></div>
  <div class="grid g2" style="margin-top:10px"><button class="btn b-amb" id="aim" style="min-height:56px;font-size:17px">🎯 Pointer la cible</button><button class="btn b-out" id="cal" style="min-height:56px;font-size:17px;border-color:var(--cy);color:var(--cy)">💨 Calypso</button></div>
  <div id="calbox"></div>
  <div id="aimbox"></div>
  <p class="note" style="margin:4px 0 0">« Pointer la cible » remplit latitude, direction et angle. Vent : 3 h = de droite, 12 h = de face (2,5 h accepté).</p>

  <div class="card" style="margin-top:14px"><h2 style="margin-bottom:4px">🌍 Terrain jusqu'à la cible</h2>
    <p class="lab" style="margin:0 0 10px">${C.zones.length ? 'Le vent mesuré à ton poste est recalculé zone par zone, à la hauteur de la balle.' : 'Terrain uniforme : le vent est le même partout. Ajoute des zones si le sol change (eau, prairie, bois…).'}</p>
    ${C.zones.map((z, i) => `<div class="grid g3" style="margin-bottom:8px;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 48px"><div><label for="zt${i}">Jusqu'à (m)</label><input id="zt${i}" inputmode="numeric" value="${z.to}"></div><div><label for="zs${i}">Sol</label><select id="zs${i}">${Object.keys(ZN).map(k => `<option value="${k}" ${z.type === k ? 'selected' : ''}>${ZN[k]}</option>`).join('')}</select></div><div style="display:flex;align-items:flex-end"><button class="btn b-out" data-zx="${i}" aria-label="Supprimer la zone" style="padding:0;width:48px">✕</button></div></div>`).join('')}
    <div class="row" style="gap:8px"><button class="btn b-out" id="zadd" style="flex:1">+ Zone</button><div style="flex:1"><label for="rg">Hauteur de tir (m)</label><input id="rg" inputmode="decimal" value="${C.h0}"></div></div>
    <p class="note" style="margin:6px 0 0">Hauteur de tir : canon au-dessus du sol (couché ≈ 0,3, table ≈ 1,2). Le premier sol est celui de ton poste, où tu mesures le vent.</p></div>

  <div class="card" style="margin-top:14px;border-color:var(--amb)"><h2 style="margin-bottom:10px">🎯 Vérifier une distance</h2>
    <div class="grid g3"><div><label for="qd">Distance (m)</label><input id="qd" inputmode="numeric" value="${Q ? Q.dist : C.dist}"></div><div><label for="qc">Taille cible (cm)</label><input id="qc" inputmode="decimal" value="${Q ? Q.cible : (C.cible || 20)}"></div><div style="display:flex;align-items:flex-end"><button class="btn b-amb" id="qgo" style="width:100%">Calculer</button></div></div>
    <div id="qres"></div></div>

  <div class="big" id="res" style="margin-top:14px"></div>
  <p class="note" id="unc" style="text-align:center;margin:6px 0 0"></p>
  <div style="margin-top:10px"><div class="row"><label for="rd" class="amb" style="font-weight:600">Distance</label><span class="num amb" style="font-size:30px" id="dv"></span></div><input id="rd" type="range" min="100" max="1200" step="10" value="${C.dist}"></div>
  <div class="grid g3" style="margin-top:12px" id="sub"></div>
  ${done.length ? `<h2 style="margin:20px 0 8px">Vérifications</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Dist.</th><th>Cible</th><th>Proposé</th><th>Réel</th><th></th></tr></thead><tbody>${done.map(v => `<tr><td>${new Date(v.date).toLocaleDateString('fr-FR')}</td><td>${v.dist} m</td><td>${v.cible ? v.cible + ' cm' : '—'}</td><td>${v.propH} / ${v.propD}</td><td>${v.realH} / ${v.realD}</td><td><button class="btn b-out" data-x="${v.id}" aria-label="Supprimer cette vérification" style="min-height:36px;padding:0 10px">✕</button></td></tr>`).join('')}</tbody></table></div>` : ''}
  <h2 style="margin:20px 0 8px">Table de tir</h2><div class="scroll"><table><thead><tr><th>Distance</th><th>Hausse</th><th>±</th><th>Dérive</th><th>m/s</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="note">Clics de 0,1 MRAD, dérive + = droite. Calcul 3D point-masse (G7), avec humidité, angle de tir, vent de travers et de face, saut aérodynamique, dérive gyroscopique, Coriolis et vent recalculé selon le terrain. « ± » = dispersion verticale due au SD de ta munition. Chaque correction recale le modèle : sous 600 m la vitesse, au-delà le BC, et la dérive par vent.</p></div>`;
  const cond = () => { C.T = num($('#rt').value); if (C.T === '') C.T = 15; C.P = num($('#rp').value) || 1013; C.hum = num($('#ru').value); if (C.hum === '') C.hum = 50; C.ang = num($('#ra').value) || 0; C.W = num($('#rw').value) || 0; C.H = num($('#rh').value); if (C.H === '' ) C.H = 3; C.H = ((C.H % 12) + 12) % 12 || 12; C.az = num($('#rz').value); C.lat = num($('#rl').value); if (C.lat === '') C.lat = 48.7; C.h0 = num($('#rg').value) || 1;
    C.zones.forEach((z, i) => { z.to = num($('#zt' + i).value) || 0; z.type = $('#zs' + i).value; }); };
  const env = () => ({ T: C.T, P: C.P, hum: C.hum, ang: C.ang, W: C.W, H: C.H, az: C.az, lat: C.lat, h0: C.h0, zones: C.zones.map(z => ({ ...z })) });
  const memo = {};
  const model = (dv0 = 0) => { const key = dv0 + JSON.stringify(env()); return memo[key] || (memo[key] = solve(a, c, v0At(K, C.T) + TR.dv + dv0, env(), TR.bm, TR.dm)); };
  const pmAt = d => K.sd ? Math.abs(model(-K.sd)(d).hf - model(K.sd)(d).hf) / 2 : 0;
  const draw = () => {
    cond(); C.dist = +$('#rd').value;
    const f = model(), r = f(C.dist), u = pmAt(C.dist);
    $('#kv').textContent = fr(v0At(K, C.T) + TR.dv);
    $('#dv').textContent = C.dist + ' m';
    $('#res').innerHTML = `<div><span>HAUSSE</span><span class="num">${r.h}</span><span>clics ${r.h >= 0 ? '↑ haut' : '↓ bas'}</span></div><div style="border-left:1px solid #245A3D"><span>DÉRIVE</span><span class="num">${Math.abs(r.d)}</span><span>clics ${r.d > 0 ? '→ droite' : r.d < 0 ? '← gauche' : ''}</span></div>`;
    $('#unc').textContent = K.sd ? `± ${fr(u)} clic (≈ ±${fr(u * C.dist / 100)} cm en hauteur) dû au SD de ${fr(K.sd)} m/s` : '';
    $('#sub').innerHTML = `<div class="kpi"><div class="num cy" style="font-size:24px">${Math.round(r.v)}</div><div class="lab">m/s cible</div></div><div class="kpi"><div class="num cy" style="font-size:24px">${Math.round(r.e)}</div><div class="lab">joules</div></div><div class="kpi"><div class="num ${r.m < 1.2 ? 'red' : 'cy'}" style="font-size:24px">${fr(r.m, 2)}</div><div class="lab">Mach</div></div>`;
    $('#tb').innerHTML = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000].map(d => { const q = f(d); return `<tr><td>${d} m</td><td class="gr"><b>${q.h}</b></td><td class="lab">${K.sd ? '±' + fr(pmAt(d)) : '—'}</td><td>${q.d}</td><td>${Math.round(q.v)}</td></tr>`; }).join('');
    if (Q) {
      const q = f(Q.dist), uq = pmAt(Q.dist), half = (Q.cible / 2) / (Q.dist / 100), marge = half - uq - .5;
      Q.propH = q.h; Q.propD = q.d; Object.assign(Q, { T: C.T, P: C.P, W: C.W, H: C.H });
      $('#qres').innerHTML = `<div class="grid g2" style="margin-top:12px"><div class="kpi" style="text-align:center"><div class="lab">Hausse</div><div class="num gr" style="font-size:44px">${q.h}</div><div class="lab">clics ${q.h >= 0 ? '↑' : '↓'}</div></div><div class="kpi" style="text-align:center"><div class="lab">Dérive</div><div class="num gr" style="font-size:44px">${Math.abs(q.d)}</div><div class="lab">clics ${q.d > 0 ? '→' : q.d < 0 ? '←' : ''}</div></div></div>
        <div class="verdict" style="background:${marge >= 0 ? '#163A2A' : '#3A2E10'};color:${marge >= 0 ? 'var(--gr)' : 'var(--amb)'}">${marge >= 0 ? '✓ Marge confortable' : '⚠ Cible juste pour ta munition'} : la cible fait ±${fr(half)} clic, ta dispersion verticale ±${fr(uq)} clic + l'arrondi du clic ±0,5.</div>
        ${st.ko ? `<div class="grid g2" style="margin-top:10px"><div><label for="kh">Hausse qui touche (clics)</label><input id="kh" inputmode="numeric" value="${q.h}"></div><div><label for="kd">Dérive qui touche (+ = droite)</label><input id="kd" inputmode="numeric" value="${q.d}"></div></div><button class="btn b-amb" id="qsave" style="width:100%;margin-top:10px">Enregistrer la correction</button>`
        : `<div class="grid g2" style="margin-top:10px"><button class="btn b-out" id="qok" style="border-color:var(--gr);color:var(--gr)">✓ Validé, touché</button><button class="btn b-red" id="qko">✗ Corriger</button></div>`}`;
      const rec = (res, h, d) => { a.verifs.push({ id: uid(), charge: c.id, date: Date.now(), dist: Q.dist, cible: Q.cible, T: C.T, env: env(), propH: Q.propH, propD: Q.propD, result: res, realH: h, realD: d }); st.chk = null; st.ko = null; save(res === 'ok' ? 'Validé : le calcul colle' : 'Modèle recalé'); calcul(a, c); };
      const ok = $('#qok'); if (ok) ok.onclick = () => rec('ok', Q.propH, Q.propD);
      const ko = $('#qko'); if (ko) ko.onclick = () => { st.ko = true; draw(); };
      const sv = $('#qsave'); if (sv) sv.onclick = () => { const h = num($('#kh').value), d = num($('#kd').value); rec('ko', h === '' ? Q.propH : Math.round(h), d === '' ? Q.propD : Math.round(d)); };
    }
  };
  const sync = () => { cond(); a.lastEnv = { hum: C.hum, lat: C.lat, h0: C.h0, zones: C.zones }; };
  ['#rd', '#rt', '#rp', '#ru', '#ra', '#rw', '#rh', '#rz', '#rl', '#rg'].forEach(s => $(s).onchange = () => { sync(); save(); draw(); });
  $('#rd').oninput = draw;
  C.zones.forEach((z, i) => { $('#zt' + i).onchange = $('#zs' + i).onchange = () => { sync(); save(); setTimeout(() => calcul(a, c)); }; });
  modalEl.querySelectorAll('[data-zx]').forEach(b => b.onclick = () => { sync(); C.zones.splice(+b.dataset.zx, 1); a.lastEnv.zones = C.zones; save(); calcul(a, c); });
  $('#zadd').onclick = () => { sync(); const last = C.zones[C.zones.length - 1]; C.zones.push({ to: last ? Math.min(1200, last.to + 200) : Math.max(100, C.dist), type: last ? (last.type === 'prairie' ? 'eau' : 'prairie') : 'prairie' }); a.lastEnv.zones = C.zones; save(); calcul(a, c); };
  $('#cal').onclick = () => calypso(v => { $('#rw').value = fr(v.u); $('#rh').value = fr(v.h, 1); sync(); save('Vent Calypso : ' + fr(v.u) + ' m/s de ' + fr(v.h, 1) + ' h'); draw(); });
  $('#aim').onclick = () => {
    const box = $('#aimbox'); let hd = null, pit = null, lat = null, stop = false;
    box.innerHTML = `<div class="card" style="margin-top:10px;border-color:var(--amb)"><p style="margin:0 0 10px">Tiens le téléphone <b>à plat</b>, le haut pointé vers la cible, et incline-le pour viser.</p>
      <div class="grid g3"><div class="kpi"><div class="num amb" style="font-size:28px" id="ah">—</div><div class="lab">cap (°)</div></div><div class="kpi"><div class="num amb" style="font-size:28px" id="ap">—</div><div class="lab">pente (°)</div></div><div class="kpi"><div class="num amb" style="font-size:28px" id="al">…</div><div class="lab">latitude</div></div></div>
      <div class="grid g2" style="margin-top:10px"><div><label for="aimd">Distance de la cible (m)</label><input id="aimd" inputmode="numeric" value="${C.dist}"></div><div style="display:flex;align-items:flex-end"><button class="btn b-amb" id="aimok" style="width:100%">Valider</button></div></div>
      <button class="btn b-out" id="aimx" style="width:100%;margin-top:8px">Annuler</button></div>`;
    const ori = e => { if (stop) return; const h = e.webkitCompassHeading ?? (e.absolute || e.type === 'deviceorientationabsolute' ? (360 - e.alpha) % 360 : null); if (h != null) { hd = h; $('#ah').textContent = Math.round(h); } if (e.beta != null) { pit = Math.max(-45, Math.min(45, e.beta)); $('#ap').textContent = (pit > 0 ? '+' : '') + pit.toFixed(1).replace('.', ','); } };
    const listen = () => { addEventListener('deviceorientationabsolute', ori); addEventListener('deviceorientation', ori); };
    const end = () => { stop = true; removeEventListener('deviceorientationabsolute', ori); removeEventListener('deviceorientation', ori); };
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().then(r => r === 'granted' ? listen() : toast('Boussole refusée')).catch(() => toast('Boussole indisponible')); else listen();
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { lat = p.coords.latitude; const el = $('#al'); if (el) el.textContent = lat.toFixed(2).replace('.', ','); }, () => { const el = $('#al'); if (el) el.textContent = '—'; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 600000 });
    $('#aimx').onclick = () => { end(); box.innerHTML = ''; };
    $('#aimok').onclick = () => { const d = Math.round(num($('#aimd').value)); if (!(d >= 10 && d <= 1200)) { toast('Distance de 10 à 1200 m'); return; } end();
      if (hd != null) $('#rz').value = Math.round(hd); if (pit != null) $('#ra').value = Math.round(pit * 10) / 10; if (lat != null) $('#rl').value = lat.toFixed(2);
      $('#rd').value = d; $('#qd').value = d; sync(); save(); box.innerHTML = '';
      toast(`Cible à ${d} m${hd != null ? ' · cap ' + Math.round(hd) + '°' : ''}${pit != null ? ' · pente ' + pit.toFixed(1).replace('.', ',') + '°' : ''}`); draw(); };
  };
  $('#qgo').onclick = () => { const d = Math.round(num($('#qd').value)), t = num($('#qc').value); if (!(d >= 10 && d <= 1200) || !(t > 0)) { toast('Distance (10 à 1200 m) et taille de cible'); return; } C.cible = t; st.ko = null; st.chk = { charge: c.id, dist: d, cible: t }; calcul(a, c); };
  $('#xc').onclick = () => { st.chk = null; st.ko = null; closeModal(); };
  modalEl.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { a.verifs = a.verifs.filter(v => v.id !== b.dataset.x); save(); calcul(a, c); });
  draw();
}

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!location.hash || location.hash === '#accueil') home(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Application installée'); });
window.addEventListener('hashchange', route);
route();
}
</script>
