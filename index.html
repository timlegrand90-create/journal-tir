<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal de tir</title>
<meta name="theme-color" content="#14181F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* VOICE everyday tool, used on a phone at the range
   IDEA a shooter's range book: one page per rifle, each string logged and checked
   PICTURE the live record itself: big numbers, colored alerts, the dope readout
   COLOUR night slate ground, amber for input, cyan for measured, green for the result
   TYPE Barlow Condensed figures + Inter text
   LAYOUT single column phone app with bottom tabs; centered 560px column on laptop */
:root{color-scheme:dark;--bg:#1C2129;--card:#252B36;--line:#323A48;--deep:#14181F;--ink:#E6EAF0;--mut:#9AA5B5;--amb:#FFB826;--cy:#4CC0F2;--gr:#40E08C;--red:#F25959}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px 110px}
h1,h2,.num{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;margin:0;line-height:1.05}
h1{font-size:34px}
h2{font-size:22px;font-weight:600}
.top{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.top .sub{color:var(--mut);font-size:14px}
.back{width:44px;height:44px;border-radius:12px;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.arme{display:block;width:100%;text-align:left;cursor:pointer}
.arme:hover{border-color:var(--amb)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border-radius:14px;padding:12px}
.kpi .num{font-size:32px}
.lab{font-size:13px;color:var(--mut)}
.amb{color:var(--amb)}.cy{color:var(--cy)}.gr{color:var(--gr)}.red{color:var(--red)}
.pill{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-gr{background:#163A2A;color:var(--gr)}.p-red{background:#4A1A1A;color:#FFC9C9}.p-mut{background:var(--deep);color:var(--mut)}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.btn{min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:600;cursor:pointer}
.b-amb{background:var(--amb);color:#1C2129}.b-out{background:transparent;border:2px solid var(--line)}.b-red{background:transparent;border:2px solid var(--red);color:var(--red)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:92px;box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:999px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.chip.on{border-color:var(--amb);background:#2E2715}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;min-height:48px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:72px}
.sec{font-size:13px;font-weight:600;color:var(--amb);margin:18px 0 8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step button{width:48px;height:48px;border-radius:12px;border:0;background:var(--line);font-size:22px;cursor:pointer}
.step .num{font-size:36px}
.drop{border:2px dashed var(--cy);background:#16242E;color:var(--cy);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.drop input{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;height:76px;background:var(--deep);border-top:1px solid #2A313D;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);text-decoration:none;font-size:12px}
.tabs a.on{color:var(--amb);font-weight:600}
.big{background:#13261C;border:2px solid var(--gr);border-radius:22px;padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.big>div{display:flex;flex-direction:column;align-items:center}
.big .num{font-size:clamp(56px,16vw,76px);color:#5CFF9D}
.big span{font-size:13px;color:#9EE8C0}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--amb)}
input[type=checkbox]{width:24px;min-height:24px;height:24px;accent-color:var(--gr)}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;color:var(--ink)}
.bar{height:10px;background:var(--deep);border-radius:5px;overflow:hidden}.bar i{display:block;height:10px;border-radius:5px}
.fig{position:relative;height:180px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:13px}
.note{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--gr);color:#0D2418;font-weight:600;padding:10px 16px;border-radius:12px}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script id="data" type="application/json">/*DATA*/{"armes":[]}/*END*/</script>
<script>
{
const raw = document.getElementById('data').textContent.replace('/*DATA*/','').replace('/*END*/','');
let D = JSON.parse(raw);
try { const l = localStorage.getItem('journal-tir'); if (l) { const o = JSON.parse(l); if ((o.t||0) > (D.t||0)) D = o; } } catch (e) {}

const $ = s => document.querySelector(s);
const app = $('#app'), tabs = $('#tabs');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr = (n, d = 1) => n === '' || n == null || isNaN(n) ? '—' : Number(n).toFixed(d).replace('.', ',');
const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? '' : x; };
const uid = () => Math.random().toString(36).slice(2, 9);
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const sdev = a => a.length < 2 ? 0 : Math.sqrt(a.reduce((s, x) => s + (x - mean(a)) ** 2, 0) / (a.length - 1));
const vOf = s => s.shots && s.shots.length ? mean(s.shots) : num(s.v);
const ICON = {
  j: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  p: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  c: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  s: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  b: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  u: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>'
};
function save(msg) {
  D.t = Date.now();
  try { localStorage.setItem('journal-tir', JSON.stringify(D)); } catch (e) {}
  if (msg) toast(msg);
}
function dl(name, text, type) { const b = new Blob([text], { type }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function csv() { const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"', n = v => v === '' || v == null ? '' : String(Math.round(v * 10) / 10).replace('.', ','); const rows = [['Arme', 'Date', 'Heure', 'Lieu', 'Charge', 'Coups', 'Distance (m)', 'T° (°C)', 'V moy (m/s)', 'SD', 'ES', 'Groupe (mm)', 'Hausse (clics)', 'Dérive (clics)', 'Nettoyé', 'Notes', 'Vitesses coup par coup'].map(q).join(';')];
  for (const a of D.armes) for (const s of sorted(a)) rows.push([q(a.nom), q(s.date), q(s.heure), q(s.lieu), q(charge(a, s.charge).nom), s.coups, s.dist, n(s.temp), n(vOf(s)), n(num(s.sd)), n(num(s.es)), n(num(s.groupe)), s.hausse, s.derive, s.nettoye ? 'oui' : '', q(s.notes), q((s.shots || []).join(' '))].join(';'));
  return rows.join('\r\n'); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const arme = id => D.armes.find(a => a.id === id);
const charge = (a, id) => a.charges.find(c => c.id === id) || { nom: '?' };
const sorted = a => [...a.series].sort((x, y) => (x.date + x.heure).localeCompare(y.date + y.heure));
const total = a => (a.coupsAvant || 0) + a.series.reduce((s, x) => s + (+x.coups || 0), 0);
function sinceClean(a) { let n = 0; for (const s of sorted(a)) { n += +s.coups || 0; if (s.nettoye) n = 0; } return n; }
function alerts(a, s) {
  const prev = sorted(a).filter(x => x.charge === s.charge && (x.date + x.heure) < (s.date + s.heure));
  if (!prev.length) return { ref: true, msg: [] };
  const msg = [], v = vOf(s);
  const pv = prev.map(vOf).filter(x => x !== '');
  if (v !== '' && pv.length) { const d = v - mean(pv); if (Math.abs(d) > 10) msg.push('vitesse ' + (d > 0 ? '+' : '') + fr(d) + ' m/s'); }
  const ps = prev.map(x => num(x.sd)).filter(x => x !== '');
  if (num(s.sd) !== '' && ps.length && num(s.sd) > 1.5 * mean(ps)) msg.push('SD ×' + fr(num(s.sd) / mean(ps)));
  const ph = prev.filter(x => num(x.dist) === num(s.dist) && num(x.hausse) !== '').map(x => num(x.hausse));
  if (num(s.hausse) !== '' && num(s.dist) !== '' && ph.length) { const d = num(s.hausse) - mean(ph); if (Math.abs(d) >= 2) msg.push('hausse ' + (d > 0 ? '+' : '') + Math.round(d) + ' clics'); }
  return { ref: false, msg };
}
const dayFmt = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

/* ---------- ballistics (point mass, G7) ---------- */
const G7M = [0,.5,.6,.7,.75,.8,.85,.9,.925,.95,.975,1,1.025,1.05,1.1,1.15,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,2,2.2,2.4,2.6,2.8,3,4];
const G7C = [.1198,.1194,.1194,.1202,.1215,.1242,.1306,.1464,.166,.2054,.2993,.3803,.4015,.4043,.4014,.3955,.3884,.3732,.358,.344,.3315,.3209,.3117,.3042,.298,.2864,.2752,.2643,.2533,.2424,.2424];
function cd(m) { m = Math.min(m, 3.9); let i = 0; while (G7M[i + 1] < m) i++; return G7C[i] + (G7C[i + 1] - G7C[i]) * (m - G7M[i]) / (G7M[i + 1] - G7M[i]); }
function solve(a, c, v0, T, P, W, H) {
  const rho = P * 100 / (287.05 * (T + 273.15)), cs = 331.3 * Math.sqrt(1 + T / 273.15), k = rho * Math.PI / (8 * c.bc * 703.0696);
  const l = c.long / 25.4 / .264, tw = a.pas / .264;
  const sg = 30 * c.grains / (tw * tw * .264 ** 3 * l * (1 + l * l)) * Math.cbrt(v0 * 3.28084 / 2800) * ((T * 1.8 + 32 + 460) / 519) * (1013.25 / P);
  const out = []; let v = v0, t = 0, vy = 0, y = 0;
  for (let x = 0; x <= 1200; x++) {
    out[x] = { v, t, y };
    const v2 = v * Math.exp(-k * cd(v / cs)), dt = 2 / (v + v2);
    const vy2 = vy * v2 / v - 9.80665 * dt; y += (vy + vy2) / 2 * dt; vy = vy2; t += dt; v = v2;
  }
  const h = a.haut / 1000, z = a.zero, th = (h - out[z].y) / z, wc = W * Math.sin(H * Math.PI / 6), lat = 48.7 * Math.PI / 180;
  return x => { const p = out[x]; const hauss = -(p.y + x * th - h) / x * 1000; const drift = (wc * (p.t - x / v0) - 1.25 * (sg + 1.2) * p.t ** 1.83 * .0254 - 7.292e-5 * x * p.t * Math.sin(lat)) / x * 1000; return { h: Math.round(hauss * 10), d: Math.round(drift * 10), v: p.v, e: .5 * c.grains * 6.479891e-5 * p.v ** 2, m: p.v / cs }; };
}

/* ---------- views ---------- */
let st = { calc: { charge: null, dist: 300, T: 15, P: 1013, W: 0, H: 3 }, form: null, del: null, addArme: false, addCharge: false, restore: null };
function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^a-([a-z0-9]+)-(journal|serie|calcul|stats)$/);
  if (!m || !arme(m[1])) return home();
  const a = arme(m[1]);
  tabs.hidden = false;
  tabs.innerHTML = [['journal', 'j', 'Journal'], ['serie', 'p', 'Série'], ['calcul', 'c', 'Calcul'], ['stats', 's', 'Stats']].map(([k, i, t]) => `<a href="#a-${a.id}-${k}" class="${m[2] === k ? 'on' : ''}">${ICON[i]}${t}</a>`).join('');
  ({ journal, serie, calcul, stats })[m[2]](a);
  window.scrollTo(0, 0);
}
function head(a, title) { return `<div class="top"><a class="back" href="#accueil" aria-label="Retour aux armes">${ICON.b}</a><div><h1>${esc(title)}</h1><div class="sub">${esc(a.nom)} · ${esc(a.calibre)}</div></div></div>`; }

function home() {
  tabs.hidden = true;
  app.innerHTML = `<div class="top"><div><h1>Mes armes</h1><div class="sub">Journal de tir · enregistré dans ce téléphone</div></div></div>
  ${D.armes.map(a => { const last = sorted(a).pop(); return `<a class="card arme" href="#a-${a.id}-journal" style="color:inherit;text-decoration:none">
    <div class="row"><div><h2>${esc(a.nom)}</h2><div class="lab">${[a.calibre, a.canon, 'pas 1:' + a.pas].filter(Boolean).map(esc).join(' · ')}</div></div><span class="num amb" style="font-size:34px">${total(a)}</span></div>
    <div class="row" style="margin-top:8px"><span class="lab">${last ? 'Dernière séance : ' + dayFmt(last.date) : 'Pas encore de séance'}</span><span class="lab">coups</span></div></a>`; }).join('')}
  ${st.addArme ? `<form class="card" id="fa"><h2 style="margin-bottom:12px">Nouvelle arme</h2>
    <div class="grid"><div><label for="an">Nom</label><input id="an" required placeholder="ex. Tikka T3x"></div>
    <div class="grid g2"><div><label for="ac">Calibre</label><input id="ac" required></div><div><label for="ak">Canon</label><input id="ak" placeholder="ex. 610 mm"></div></div>
    <div class="grid g3"><div><label for="ap">Pas (pouces)</label><input id="ap" inputmode="decimal" value="8"></div><div><label for="ah">Haut. axe (mm)</label><input id="ah" inputmode="decimal" value="50"></div><div><label for="az">Zéro (m)</label><input id="az" inputmode="decimal" value="100"></div></div>
    <div class="row"><button type="button" class="btn b-out" id="acx">Annuler</button><button class="btn b-amb">Créer l'arme</button></div></div></form>`
  : `<button class="btn b-amb" id="aa" style="width:100%">+ Ajouter une arme</button>`}
  <div class="card" style="margin-top:18px"><h2 style="margin-bottom:6px">Sauvegarde</h2><p class="lab" style="margin:0 0 12px">Tes données sont uniquement dans ce téléphone. Fais une sauvegarde de temps en temps et garde le fichier ailleurs (Drive, mail, ordi).${D.lastBackup ? ' Dernière sauvegarde : ' + new Date(D.lastBackup).toLocaleDateString('fr-FR') + '.' : ' Aucune sauvegarde pour l\'instant.'}</p>
  <div class="grid g3"><button class="btn b-amb" id="bk">Sauvegarder</button><label class="btn b-out" for="rs" style="display:flex;align-items:center;justify-content:center;margin:0;color:var(--ink);font-size:16px">Restaurer<input id="rs" type="file" accept=".json,application/json" style="display:none"></label><button class="btn b-out" id="ex">Export tableur</button></div>
  ${st.restore ? `<div class="card" style="margin:12px 0 0;border-color:var(--red)"><p style="margin:0 0 10px">Remplacer tout le journal actuel par cette sauvegarde (${st.restore.armes.length} arme(s)) ?</p><div class="row"><button class="btn b-out" id="rsn">Annuler</button><button class="btn b-red" id="rsy">Oui, restaurer</button></div></div>` : ''}</div>
  <p class="note">Fonctionne sans internet une fois installée (menu Chrome › Installer l'application).</p>`;
  $('#bk').onclick = () => { D.lastBackup = Date.now(); save(); dl('journal-tir-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(D, null, 1), 'application/json'); home(); };
  $('#ex').onclick = () => dl('journal-tir-series-' + new Date().toISOString().slice(0, 10) + '.csv', '\ufeff' + csv(), 'text/csv');
  $('#rs').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); if (!Array.isArray(o.armes)) throw 0; st.restore = o; } catch (x) { toast('Fichier de sauvegarde invalide'); } home(); }); };
  if (st.restore) { $('#rsn').onclick = () => { st.restore = null; home(); }; $('#rsy').onclick = () => { D = st.restore; st.restore = null; save('Journal restauré'); home(); }; }
  const aa = $('#aa'); if (aa) aa.onclick = () => { st.addArme = true; home(); };
  const f = $('#fa'); if (f) { $('#acx').onclick = () => { st.addArme = false; home(); }; f.onsubmit = e => { e.preventDefault(); const id = uid(); D.armes.push({ id, nom: $('#an').value.trim(), calibre: $('#ac').value.trim(), canon: $('#ak').value.trim(), pas: num($('#ap').value) || 8, haut: num($('#ah').value) || 50, zero: num($('#az').value) || 100, coupsAvant: 0, charges: [], series: [] }); st.addArme = false; save('Arme ajoutée'); location.hash = 'a-' + id + '-journal'; }; }
}

function journal(a) {
  const ser = sorted(a).reverse(), days = [...new Set(ser.map(s => s.date))];
  app.innerHTML = head(a, 'Journal') + `<div class="grid g3">
    <div class="kpi"><div class="num amb">${total(a)}</div><div class="lab">coups au total</div></div>
    <div class="kpi"><div class="num cy">${sinceClean(a)}</div><div class="lab">depuis nettoyage</div></div>
    <div class="kpi"><div class="num gr">${a.series.length}</div><div class="lab">séries</div></div></div>
  ${days.length ? '' : '<div class="card" style="margin-top:16px"><h2>Aucune série</h2><p class="lab">Touche « Nouvelle série » après ton premier tir.</p></div>'}
  ${days.map(d => `<div class="day"><h2 style="text-transform:capitalize">${dayFmt(d)}</h2><span class="lab">${esc(ser.find(s => s.date === d).lieu || '')}</span></div>` + ser.filter(s => s.date === d).map(s => {
    const al = alerts(a, s), c = charge(a, s.charge), v = vOf(s);
    const tag = al.ref ? '<span class="pill p-mut">1re série = référence</span>' : al.msg.length ? `<span class="pill p-red">⚠ ${esc(al.msg.join(' · '))}</span>` : '<span class="pill p-gr">✓ RAS</span>';
    const sdc = num(s.sd) === '' ? '' : num(s.sd) <= 4 ? 'gr' : num(s.sd) <= 7 ? 'amb' : 'red';
    return `<article class="card"><div class="row"><div><div style="font-weight:600">${esc(c.nom)}</div><div class="lab">${esc(s.heure || '')}${s.dist ? ' · ' + esc(s.dist) + ' m' : ''}${s.temp !== '' ? ' · ' + esc(s.temp) + ' °C' : ''}</div></div>${tag}</div>
      <div class="grid g4" style="margin-top:10px"><div><div class="num" style="font-size:26px">${esc(s.coups)}</div><div class="lab">coups</div></div><div><div class="num cy" style="font-size:26px">${fr(v)}</div><div class="lab">m/s</div></div><div><div class="num ${sdc}" style="font-size:26px">${fr(num(s.sd))}</div><div class="lab">SD</div></div><div><div class="num" style="font-size:26px">${fr(num(s.es))}</div><div class="lab">ES</div></div></div>
      ${(s.groupe !== '' || s.hausse !== '' || s.notes) ? `<div class="lab" style="margin-top:8px">${s.groupe !== '' ? 'Groupe ' + esc(s.groupe) + ' mm · ' : ''}${s.hausse !== '' ? 'Hausse ' + esc(s.hausse) + ' clics · ' : ''}${esc(s.notes || '')}${s.nettoye ? ' · nettoyé' : ''}</div>` : ''}
      <div class="row" style="margin-top:10px"><button class="btn b-out" data-ed="${s.id}">Modifier</button>${st.del === s.id ? `<button class="btn b-red" data-ok="${s.id}">Confirmer la suppression</button>` : `<button class="btn b-out" data-del="${s.id}">Supprimer</button>`}</div></article>`;
  }).join('')).join('')}
  <a class="btn b-amb fab" href="#a-${a.id}-serie">${ICON.p}Nouvelle série</a>`;
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { st.del = b.dataset.del; journal(a); });
  app.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { a.series = a.series.filter(s => s.id !== b.dataset.ok); st.del = null; save('Série supprimée'); journal(a); });
  app.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { st.form = JSON.parse(JSON.stringify(a.series.find(s => s.id === b.dataset.ed))); location.hash = 'a-' + a.id + '-serie'; });
}

function blank(a) { const n = new Date(), last = sorted(a).pop(); return { id: null, date: n.toISOString().slice(0, 10), heure: n.toTimeString().slice(0, 5), lieu: last ? last.lieu : '', charge: last ? last.charge : (a.charges[0] || {}).id, coups: 5, dist: last ? last.dist : 100, temp: '', v: '', sd: '', es: '', groupe: '', hausse: '', derive: '', nettoye: false, notes: '', shots: [] }; }
function serie(a) {
  const f = st.form && (st.form.armeId === a.id || st.form.id) ? st.form : (st.form = Object.assign(blank(a), { armeId: a.id }));
  const sv = f.shots.length ? `Fichier importé : ${f.shots.length} vitesses · moy ${fr(mean(f.shots))} · SD ${fr(sdev(f.shots))} · ES ${fr(Math.max(...f.shots) - Math.min(...f.shots))}` : '';
  app.innerHTML = head(a, f.id ? 'Modifier la série' : 'Nouvelle série') + `<form id="fs">
  <div class="sec">Charge</div><div class="chips">${a.charges.map(c => `<button type="button" class="chip ${f.charge === c.id ? 'on' : ''}" data-c="${c.id}"><div style="font-weight:600">${esc(c.nom)}</div><div class="lab">${esc(c.poudre)}${c.oal ? ' · OAL ' + esc(c.oal) : ''}</div></button>`).join('')}<button type="button" class="chip" id="nc">+ Charge</button></div>
  ${st.addCharge ? `<div class="card" style="margin-top:10px"><div class="grid"><div><label for="cn">Nom court</label><input id="cn" placeholder="ex. Hornady 140 · H4350 2,70 g"></div><div class="grid g2"><div><label for="cb">Balle</label><input id="cb"></div><div><label for="cp">Poudre</label><input id="cp"></div></div><div class="grid g4"><div><label for="cg">Poids (gr)</label><input id="cg" inputmode="decimal"></div><div><label for="cl">Long. (mm)</label><input id="cl" inputmode="decimal"></div><div><label for="cc">BC G7</label><input id="cc" inputmode="decimal"></div><div><label for="co">OAL</label><input id="co" inputmode="decimal"></div></div><button type="button" class="btn b-amb" id="cok">Ajouter la charge</button></div></div>` : ''}
  <div class="grid g2" style="margin-top:14px"><div><label for="fd">Date</label><input id="fd" type="date" value="${esc(f.date)}"></div><div><label for="fl">Lieu</label><input id="fl" value="${esc(f.lieu)}"></div></div>
  <div class="grid g2" style="margin-top:10px"><div class="kpi"><div class="lab">Coups</div><div class="step"><button type="button" id="cm" aria-label="Un coup de moins">−</button><span class="num amb">${esc(f.coups)}</span><button type="button" id="cpl" aria-label="Un coup de plus">+</button></div></div>
    <div class="grid"><div><label for="fdi">Distance de ces ${esc(f.coups)} coups (m)</label><input id="fdi" inputmode="numeric" value="${esc(f.dist)}"></div><div><label for="ft">Température (°C)</label><input id="ft" inputmode="decimal" value="${esc(f.temp)}"></div></div></div>
  <div class="sec">Vitesses</div>
  <label class="drop" for="csv">${ICON.u}<span><b>Importer le fichier du chrono</b><br><span class="lab">Garmin Xero, LabRadar… (.csv)</span></span><input id="csv" type="file" accept=".csv,.txt,text/csv"></label>
  ${sv ? `<p class="note gr">${sv}</p>` : `<div class="grid g3" style="margin-top:10px"><div><label for="fv">V moy</label><input id="fv" inputmode="decimal" value="${esc(f.v)}"></div><div><label for="fsd">SD</label><input id="fsd" inputmode="decimal" value="${esc(f.sd)}"></div><div><label for="fes">ES</label><input id="fes" inputmode="decimal" value="${esc(f.es)}"></div></div>`}
  <div class="sec">Résultat</div>
  <div class="grid g3"><div><label for="fg">Groupe (mm)</label><input id="fg" inputmode="decimal" value="${esc(f.groupe)}"></div><div><label for="fh">Hausse (clics)</label><input id="fh" inputmode="numeric" value="${esc(f.hausse)}"></div><div><label for="fde">Dérive (clics)</label><input id="fde" inputmode="numeric" value="${esc(f.derive)}"></div></div>
  <div style="margin-top:10px"><label for="fn">Notes</label><textarea id="fn">${esc(f.notes)}</textarea></div>
  <label class="check"><input type="checkbox" id="fc" ${f.nettoye ? 'checked' : ''}>Canon nettoyé après cette série</label>
  <button class="btn b-amb" style="width:100%;margin-top:8px">Enregistrer la série</button></form>`;
  const keep = () => { const g = id => { const e = $('#' + id); return e ? e.value : undefined; }; Object.assign(f, { date: g('fd'), lieu: g('fl'), dist: g('fdi'), temp: g('ft'), groupe: g('fg'), hausse: g('fh'), derive: g('fde'), notes: g('fn'), nettoye: $('#fc').checked }); if ($('#fv')) Object.assign(f, { v: g('fv'), sd: g('fsd'), es: g('fes') }); };
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { keep(); f.charge = b.dataset.c; serie(a); });
  $('#nc').onclick = () => { keep(); st.addCharge = !st.addCharge; serie(a); };
  const cok = $('#cok'); if (cok) cok.onclick = () => { const n = $('#cn').value.trim(); if (!n) return; const id = uid(); a.charges.push({ id, nom: n, balle: $('#cb').value, poudre: $('#cp').value, grains: num($('#cg').value) || 140, long: num($('#cl').value) || 34, bc: num($('#cc').value) || .3, oal: $('#co').value, masse: '' }); keep(); f.charge = id; st.addCharge = false; save('Charge ajoutée'); serie(a); };
  $('#cm').onclick = () => { keep(); f.coups = Math.max(1, f.coups - 1); serie(a); };
  $('#cpl').onclick = () => { keep(); f.coups++; serie(a); };
  $('#csv').onchange = e => { const file = e.target.files[0]; if (!file) return; file.text().then(t => { keep(); const shots = []; for (const line of t.split(/\r?\n/)) { const m = line.match(/^\s*\d+\s*[,;]\s*"?(\d{3,4}(?:[.,]\d+)?)"?/); if (m) shots.push(parseFloat(m[1].replace(',', '.'))); } if (!shots.length) { toast('Aucune vitesse trouvée'); return; } f.shots = shots; f.coups = shots.length; f.v = fr(mean(shots)); f.sd = +sdev(shots).toFixed(1); f.es = +(Math.max(...shots) - Math.min(...shots)).toFixed(1); serie(a); }); };
  $('#fs').onsubmit = e => { e.preventDefault(); keep(); if (!f.charge) { toast('Ajoute une charge'); return; } const s = { id: f.id || uid(), date: f.date, heure: f.heure, lieu: f.lieu, charge: f.charge, coups: f.coups, dist: num(f.dist), temp: num(f.temp), v: f.shots.length ? '' : num(f.v), sd: num(f.sd), es: num(f.es), groupe: num(f.groupe), hausse: num(f.hausse), derive: num(f.derive), nettoye: f.nettoye, notes: f.notes, shots: f.shots };
    const i = a.series.findIndex(x => x.id === s.id); if (i >= 0) a.series[i] = s; else a.series.push(s); st.form = null; save('Série enregistrée'); location.hash = 'a-' + a.id + '-journal'; };
}

function calcul(a) {
  const C = st.calc; if (!a.charges.find(c => c.id === C.charge)) C.charge = (a.charges[0] || {}).id;
  const c = a.charges.find(x => x.id === C.charge);
  if (!c) { app.innerHTML = head(a, 'Calculateur') + '<div class="card"><p>Ajoute d\'abord une charge dans « Série ».</p></div>'; return; }
  const meas = a.series.filter(s => s.charge === c.id && vOf(s) !== '');
  const v0 = meas.length ? mean(meas.map(vOf)) : 0;
  app.innerHTML = head(a, 'Calculateur') + `<div class="chips">${a.charges.map(x => `<button type="button" class="chip ${x.id === c.id ? 'on' : ''}" data-c="${x.id}">${esc(x.nom)}</button>`).join('')}</div>
  ${v0 ? `<p class="note">V0 = <b class="gr">${fr(v0)} m/s</b>, moyenne de tes ${meas.length} série(s) mesurée(s) · BC G7 ${fr(c.bc, 3)}</p>
  <div class="big" id="res"></div>
  <div style="margin-top:14px"><div class="row"><label for="rd" class="amb" style="font-weight:600">Distance</label><span class="num amb" style="font-size:30px" id="dv"></span></div><input id="rd" type="range" min="100" max="1200" step="10" value="${C.dist}"></div>
  <div class="grid g4"><div><label for="rt">T° (°C)</label><input id="rt" inputmode="decimal" value="${C.T}"></div><div><label for="rp">hPa</label><input id="rp" inputmode="numeric" value="${C.P}"></div><div><label for="rw">Vent m/s</label><input id="rw" inputmode="decimal" value="${C.W}"></div><div><label for="rh">Heure</label><select id="rh">${[...Array(12)].map((_, i) => `<option ${C.H === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div></div>
  <div class="grid g3" style="margin-top:12px" id="sub"></div>
  <h2 style="margin:20px 0 8px">Table de tir</h2><div class="scroll"><table><thead><tr><th>Distance</th><th>Hausse</th><th>Relevé</th><th>Dérive</th><th>m/s</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="note">Relevé = moyenne de tes hausses réellement affichées à cette distance (±25 m). Clics de 0,1 MRAD, dérive + = droite.</p>`
  : '<div class="card"><h2>Pas encore de vitesse mesurée</h2><p class="lab">Enregistre une série avec ton chrono pour activer le calculateur.</p></div>'}`;
  app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { C.charge = b.dataset.c; calcul(a); });
  if (!v0) return;
  const draw = () => {
    C.dist = +$('#rd').value; C.T = num($('#rt').value) || 15; C.P = num($('#rp').value) || 1013; C.W = num($('#rw').value) || 0; C.H = +$('#rh').value;
    const f = solve(a, c, v0, C.T, C.P, C.W, C.H), r = f(C.dist);
    const rel = d => { const x = a.series.filter(s => s.charge === c.id && num(s.hausse) !== '' && Math.abs(num(s.dist) - d) <= 25).map(s => num(s.hausse)); return x.length ? Math.round(mean(x)) : ''; };
    const rr = rel(C.dist);
    $('#dv').textContent = C.dist + ' m';
    $('#res').innerHTML = `<div><span>HAUSSE${rr !== '' ? ' · relevée' : ''}</span><span class="num">${rr !== '' ? rr : r.h}</span><span>clics ${r.h >= 0 ? '↑ haut' : '↓ bas'}</span></div><div style="border-left:1px solid #245A3D"><span>DÉRIVE</span><span class="num">${Math.abs(r.d)}</span><span>clics ${r.d > 0 ? '→ droite' : r.d < 0 ? '← gauche' : ''}</span></div>`;
    $('#sub').innerHTML = `<div class="kpi"><div class="num cy" style="font-size:24px">${Math.round(r.v)}</div><div class="lab">m/s cible</div></div><div class="kpi"><div class="num cy" style="font-size:24px">${Math.round(r.e)}</div><div class="lab">joules</div></div><div class="kpi"><div class="num ${r.m < 1.2 ? 'red' : 'cy'}" style="font-size:24px">${fr(r.m, 2)}</div><div class="lab">Mach</div></div>`;
    $('#tb').innerHTML = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000].map(d => { const q = f(d), rv = rel(d); return `<tr><td>${d} m</td><td class="gr"><b>${q.h}</b></td><td class="amb">${rv === '' ? '—' : rv}</td><td>${q.d}</td><td>${Math.round(q.v)}</td></tr>`; }).join('');
  };
  ['#rd', '#rt', '#rp', '#rw', '#rh'].forEach(s => $(s).oninput = draw);
  draw();
}

function stats(a) {
  const ser = sorted(a).filter(s => s.shots && s.shots.length);
  const cols = ['#4CC0F2', '#FFB826', '#40E08C', '#E87BD0', '#F25959'];
  const byC = a.charges.map((c, i) => { const s = a.series.filter(x => x.charge === c.id && num(x.sd) !== ''); return { c, col: cols[i % 5], n: a.series.filter(x => x.charge === c.id).reduce((t, x) => t + (+x.coups || 0), 0), sd: s.length ? mean(s.map(x => num(x.sd))) : '', es: s.length ? mean(s.map(x => num(x.es))) : '' }; });
  const best = byC.filter(x => x.sd !== '').sort((x, y) => x.sd - y.sd)[0];
  app.innerHTML = head(a, 'Stats') + `<div class="grid g2"><div class="kpi"><div class="num amb">${total(a)}</div><div class="lab">coups tirés</div></div><div class="kpi"><div class="num gr">${best ? fr(best.sd) : '—'}</div><div class="lab">meilleur SD moyen${best ? ' · ' + esc(best.c.nom) : ''}</div></div></div>
  <div class="card" style="margin-top:12px"><h2>Vitesse coup par coup</h2><div class="fig"><svg id="sv" role="img" aria-label="Vitesse de chaque coup, par série"></svg></div>
  <div class="chips">${ser.map(s => { const i = a.charges.findIndex(c => c.id === s.charge); return `<span class="lab"><b style="color:${cols[i % 5]}">●</b> ${esc(charge(a, s.charge).nom)} · ${new Date(s.date + 'T12:00').toLocaleDateString('fr-FR')}</span>`; }).join('')}</div></div>
  <div class="card"><h2 style="margin-bottom:10px">Régularité par charge</h2>${byC.map(x => `<div style="margin-bottom:12px"><div class="row"><span>${esc(x.c.nom)}</span><span class="lab">${x.n} coups · SD ${fr(x.sd)} · ES ${fr(x.es)}</span></div><div class="bar"><i style="width:${x.sd === '' ? 0 : Math.min(100, x.sd * 10)}%;background:${x.sd === '' ? 'none' : x.sd <= 4 ? '#40E08C' : x.sd <= 7 ? '#FFB826' : '#F25959'}"></i></div></div>`).join('')}<p class="note">Barre courte = charge régulière (échelle SD 0 à 10 m/s).</p></div>`;
  const s = $('#sv');
  const plot = () => { const W = s.clientWidth, H = s.clientHeight; if (!W || !ser.length) { s.innerHTML = ''; return; } const all = ser.flatMap(x => x.shots), lo = Math.floor(Math.min(...all) / 5) * 5 - 5, hi = Math.ceil(Math.max(...all) / 5) * 5 + 5, n = Math.max(...ser.map(x => x.shots.length)); const X = i => 40 + i * (W - 50) / Math.max(1, n - 1), Y = v => 10 + (hi - v) / (hi - lo) * (H - 30);
    s.innerHTML = [lo, (lo + hi) / 2, hi].map(v => `<line x1="40" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#323A48"/><text x="0" y="${Y(v) + 4}" fill="#9AA5B5" font-size="12">${Math.round(v)}</text>`).join('') + ser.map(x => { const col = cols[a.charges.findIndex(c => c.id === x.charge) % 5]; return `<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${x.shots.map((v, i) => X(i) + ',' + Y(v)).join(' ')}"/>`; }).join(''); };
  const ro = new ResizeObserver(plot); ro.observe(s);
}

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', route);
route();
}
</script>
</body>
</html>
